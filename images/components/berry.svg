<?xml version="1.0" encoding="utf-8" ?>
<svg id="berry" xmlns="http://www.w3.org/2000/svg" width="350" height="450" viewBox="0 -50 350 450">

  <!-- ========================= -->
  <!--        BERRY BODY         -->
  <!-- ========================= -->

  <!-- Outer ring (dark blue) -->
  <g fill="#401880">
    <circle cx="120" cy="110" r="34"/>
    <circle cx="170" cy="100" r="34"/>
    <circle cx="220" cy="110" r="34"/>

    <circle cx="90" cy="150" r="34"/>
    <circle cx="80" cy="200" r="34"/>
    <circle cx="95" cy="250" r="34"/>
    <circle cx="130" cy="290" r="34"/>
    <circle cx="175" cy="310" r="34"/>
    <circle cx="215" cy="290" r="34"/>
    <circle cx="245" cy="250" r="34"/>
    <circle cx="260" cy="200" r="34"/>
    <circle cx="250" cy="150" r="34"/>
  </g>

  <!-- Middle ring (dark purple) -->
  <g fill="#451890">
    <circle cx="140" cy="150" r="34"/>
    <circle cx="185" cy="145" r="34"/>
    <circle cx="225" cy="160" r="34"/>
    <circle cx="110" cy="180" r="34"/>
    <circle cx="120" cy="230" r="34"/>
    <circle cx="150" cy="265" r="34"/>
    <circle cx="195" cy="260" r="34"/>
    <circle cx="225" cy="220" r="34"/>
    <circle cx="235" cy="180" r="34"/>
  </g>

  <!-- Inner ring (lighter purple) -->
  <g fill="#451895">
    <circle cx="155" cy="200" r="34"/>
    <circle cx="165" cy="235" r="34"/>
    <circle cx="190" cy="210" r="34"/>
    <circle cx="190" cy="175" r="34"/>
    <circle cx="165" cy="165" r="34"/>
  </g>

  <!-- ========================= -->
  <!--          LEAVES           -->
  <!-- ========================= -->

  <!-- Left leaf -->
  <g transform="translate(130,40) rotate(45)">
    <ellipse cx="0" cy="0" rx="60" ry="25" fill="#37A944"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#A4F4AA" stroke-width="3"/>
  </g>

  <!-- Right leaf -->
  <g transform="translate(220,30) rotate(-45)">
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="#37A944"/>
    <line x1="-65" y1="0" x2="60" y2="0" stroke="#A4F4AA" stroke-width="3"/>
  </g>
</svg>
