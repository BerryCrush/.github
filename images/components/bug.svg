<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160">

  <!-- Shadow -->
  <ellipse cx="75.389" cy="131.534" rx="55" ry="10" fill="rgba(0,0,0,0.25)"/>

  <defs>
    <!-- Reusable wing -->
    <g id="wing">
      <ellipse cx="0" cy="0" rx="150" ry="70"
               fill="rgb(230,230,230)" fill-opacity="0.6"
               stroke="rgb(0,0,0)" stroke-width="1"/>

      <line x1="-100" y1="0" x2="120" y2="0" stroke="rgb(0,0,0)" stroke-width="3"/>

      <line x1="-20" y1="50" x2="40" y2="0" stroke="rgb(0,0,0)" stroke-width="3"/>
      <line x1="60"  y1="50" x2="120" y2="0" stroke="rgb(0,0,0)" stroke-width="3"/>

      <line x1="60"  y1="-50" x2="120" y2="0" stroke="rgb(0,0,0)" stroke-width="3"/>
      <line x1="-20" y1="-50" x2="40" y2="0" stroke="rgb(0,0,0)" stroke-width="3"/>
    </g>

    <!-- Reusable eye -->
    <g id="eye">
      <circle cx="0" cy="0" r="8" fill="rgb(212,0,0)"/>
      <line x1="-4" y1="-4" x2="4" y2="4"
            stroke="rgb(0,0,0)" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-4" x2="-4" y2="4"
            stroke="rgb(0,0,0)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- Body -->
  <ellipse cx="53.767" cy="85.463" rx="28" ry="20" fill="#000"/>
  <ellipse cx="86.054" cy="98.167" rx="17.26" ry="15.397" fill="#000"/>
  <ellipse cx="112.757" cy="94.18" rx="20" ry="15" fill="#000"/>

  <!-- Eyes (replaced eye1 + eye2) -->
  <use href="#eye" transform="translate(106.596779, 81.978439)"/>
  <use href="#eye" transform="translate(123.740707, 82.136215)"/>

  <!-- Legs -->
  <line x1="118.012" y1="101.253" x2="92.321" y2="99.51" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="99.602" y1="94.33" x2="116.422" y2="95.129" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="55.851" y1="109.413" x2="70.965" y2="103.635" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="59.952" y1="114.458" x2="78.715" y2="106.789" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="64.605" y1="118.859" x2="83.761" y2="110.97" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="118.148" y1="106.961" x2="98.995" y2="105.656" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- Wings (replaced wing1 + wing2) -->
  <use href="#wing"
       transform="matrix(0.253962, -0.044781, 0.040883, 0.231859, 53.55682, 94.909698)"/>
  <use href="#wing"
       transform="matrix(0.24729, 0.066262, -0.070734, 0.263981, 55.997616, 74.485825)"/>
</svg>
